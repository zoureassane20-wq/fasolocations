<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FasoLocations - Matériels & Engins</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7f6;
  color: #222;
}

header {
  background: #087443;
  color: white;
  padding: 25px 18px 30px;
  text-align: center;
}

.logo {
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 20px;
}

.search {
  width: 100%;
  max-width: 650px;
  padding: 16px;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  outline: none;
}

.container {
  width: 92%;
  max-width: 1100px;
  margin: 25px auto;
}

.publish-btn {
  width: 100%;
  background: #087443;
  color: white;
  border: none;
  padding: 16px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 30px;
}

h2 {
  color: #087443;
  font-size: 28px;
  margin-bottom: 20px;
}

.categories {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  margin-bottom: 40px;
}

.category {
  background: white;
  padding: 25px 10px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 3px 10px #ddd;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.category.active {
  background: #087443;
  color: white;
}

.annonces {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 3px 10px #ddd;
}

.card-image {
  width: 100%;
  height: 210px;
  object-fit: cover;
  display: block;
}

.card-content {
  padding: 20px;
}

.card h3 {
  color: #087443;
  font-size: 22px;
  margin-bottom: 12px;
}

.card p {
  margin: 8px 0;
  color: #555;
}

.prix {
  font-size: 20px !important;
  font-weight: bold;
  color: #222 !important;
  margin: 15px 0 !important;
}

.whatsapp {
  display: block;
  background: #25D366;
  color: white;
  text-decoration: none;
  padding: 13px;
  text-align: center;
  border-radius: 9px;
  margin-top: 15px;
  font-weight: bold;
}

.delete-btn {
  width: 100%;
  background: #e53935;
  color: white;
  border: none;
  padding: 11px;
  border-radius: 8px;
  margin-top: 10px;
  font-weight: bold;
}

.no-result {
  display: none;
  background: white;
  padding: 30px;
  text-align: center;
  border-radius: 12px;
  color: #777;
}

.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.65);
  overflow-y: auto;
}
